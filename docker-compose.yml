services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-conecta_rs}
      MYSQL_USER: ${MYSQL_USER:-poalab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-poalab}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_net
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-poalab}:${MYSQL_PASSWORD:-poalab}@mysql:3306/${MYSQL_DATABASE:-conecta_rs}
      SHADOW_DATABASE_URL: mysql://${MYSQL_USER:-poalab}:${MYSQL_PASSWORD:-poalab}@mysql:3306/conecta_rs_shadow
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Defina BETTER_AUTH_SECRET no .env da raiz}
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:?Defina BETTER_AUTH_BASE_URL no .env da raiz}
      FRONTEND_URL: ${FRONTEND_URL:?Defina FRONTEND_URL no .env da raiz}
      CREATE_ADMIN: ${CREATE_ADMIN:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@conecta.rs}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - app_net
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app_net
    depends_on:
      - backend

networks:
  app_net:
    driver: bridge

volumes:
  mysql_data:
