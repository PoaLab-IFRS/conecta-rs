services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-conecta_rs}
      MYSQL_USER: ${MYSQL_USER:-poalab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-poalab}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_net
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-poalab}:${MYSQL_PASSWORD:-poalab}@mysql:3306/${MYSQL_DATABASE:-conecta_rs}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - app_net
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app_net
    depends_on:
      - backend

networks:
  app_net:
    driver: bridge

volumes:
  mysql_data:
